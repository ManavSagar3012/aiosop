services:
  neo4j:
    image: neo4j:5.18-community
    container_name: ai-osop-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${OSOP_NEO4J_PASSWORD:-change-me-local}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ai-osop

  postgres:
    image: pgvector/pgvector:pg15
    container_name: ai-osop-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=osop
      - POSTGRES_PASSWORD=osop
      - POSTGRES_DB=osop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-osop

  redis:
    image: redis:7-alpine
    container_name: ai-osop-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-osop

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-osop:local
    container_name: ai-osop-api
    ports:
      # PATCH (REL-001, 2026-06-15): Was 8080:8080 — but :8080 is squatted by
      # Oracle TNSLSNR/XDB on common dev hosts (TNS XDB picks 8080 by default).
      # The real API uvicorn invocation (poetry run uvicorn ai_osop.api.main:app
      # --port 8200) listens on :8200 and is what the runtime actually uses.
      # Standardize on :8200 here so docker-compose matches reality.
      - "8200:8200"
    environment:
      - OSOP_ENV=development
      - OSOP_NEO4J_URI=bolt://neo4j:7687
      - OSOP_NEO4J_PASSWORD=${OSOP_NEO4J_PASSWORD:-change-me-local}
      - OSOP_ATTESTED_REPORT_ROOT=/app/reports
      - OSOP_POSTGRES_URI=postgresql+asyncpg://osop:osop@postgres:5432/osop
      - OSOP_REDIS_URI=redis://redis:6379/0
      - OSOP_THREAT_INTEL_MCP_HOST=threat-intel-mcp
    depends_on:
      - neo4j
      - postgres
      - redis
      - threat-intel-mcp
    networks:
      - ai-osop
    volumes:
      - ./src:/app/src
      - reports_data:/app/reports

  threat-intel-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-osop:local
    container_name: ai-osop-threat-intel-mcp
    command: ["uvicorn", "threat_intel_mcp:app", "--app-dir", "/app/mcp-servers/python", "--host", "0.0.0.0", "--port", "8086"]
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai-osop

volumes:
  reports_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:

networks:
  ai-osop:
    driver: bridge
