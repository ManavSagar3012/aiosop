version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: ai-osop-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${OSOP_NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ai-osop

  postgres:
    image: pgvector/pgvector:pg15
    container_name: ai-osop-postgres
    restart: unless-stopped
    ports:
      # PATCH (AIOSOP-PROD-001, 2026-06-27): Remap to 15432 to avoid conflict with
      # wslrelay.exe (or local PostgreSQL) that shadows 127.0.0.1:5432 on dev hosts
      # running WSL2. The API .env uses 127.0.0.1:15432 to reach this container
      # from the host. The internal docker network (postgres:5432) is unaffected.
      - "15432:5432"
    environment:
      - POSTGRES_USER=${OSOP_POSTGRES_USER}
      - POSTGRES_PASSWORD=${OSOP_POSTGRES_PASSWORD}
      - POSTGRES_DB=${OSOP_POSTGRES_DB:-osop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-osop

  redis:
    image: redis:7-alpine
    container_name: ai-osop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-osop

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-osop-api
    restart: unless-stopped
    ports:
      # PATCH (REL-001, 2026-06-15): Was 8080:8080 — but :8080 is squatted by
      # Oracle TNSLSNR/XDB on common dev hosts (TNS XDB picks 8080 by default).
      # The real API uvicorn invocation (poetry run uvicorn ai_osop.api.main:app
      # --port 8200) listens on :8200 and is what the runtime actually uses.
      # Standardize on :8200 here so docker-compose matches reality.
      - "8200:8200"
    environment:
      - OSOP_ENV=development
      - OSOP_API_TOKEN=${OSOP_API_TOKEN}
      - OSOP_NEO4J_URI=bolt://neo4j:7687
      - OSOP_NEO4J_PASSWORD=${OSOP_NEO4J_PASSWORD}
      - OSOP_POSTGRES_URI=postgresql+asyncpg://${OSOP_POSTGRES_USER}:${OSOP_POSTGRES_PASSWORD}@postgres:5432/${OSOP_POSTGRES_DB}
      - OSOP_REDIS_URI=redis://redis:6379/0
    depends_on:
      - neo4j
      - postgres
      - redis
    networks:
      - ai-osop
    # DEVELOPMENT USE ONLY: Uncomment the line below to enable live code reloading.
    # For production, remove this volume mount to enforce immutable infrastructure.
    # volumes:
    #   - ./src:/app/src
    volumes: []

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:

networks:
  ai-osop:
    driver: bridge
