apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-osop-log-config
  namespace: ai-osop
  labels:
    app: ai-osop
    component: logging
data:
  log-retention.json: |
    {
      "retention_days": {
        "debug": 7,
        "info": 30,
        "warning": 90,
        "error": 365,
        "audit": 2555
      },
      "max_log_size_mb": 100,
      "max_log_files": 10,
      "compress_rotated": true,
      "log_format": "json",
      "timestamp_format": "iso8601",
      "include_request_id": true,
      "include_trace_id": true
    }
