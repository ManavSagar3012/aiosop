apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-osop-sandbox-network-guard
  namespace: ai-osop
spec:
  podSelector:
    matchLabels:
      app: ai-osop
      component: sandbox
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: ai-osop-sandbox-network-guard-syscalls
  namespace: ai-osop
spec:
  podSelector:
    matchLabels:
      app: ai-osop
      component: sandbox
  kprobes:
    - call: security_socket_create
      syscall: false
      args:
        - index: 0
          type: int
          label: family
        - index: 1
          type: int
          label: type
        - index: 2
          type: int
          label: protocol
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "3"
          matchActions:
            - action: Sigkill
    - call: security_socket_connect
      syscall: false
      args:
        - index: 0
          type: sock
          label: socket
        - index: 1
          type: sockaddr
          label: destination
      selectors:
        - matchActions:
            - action: Post
