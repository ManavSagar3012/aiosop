apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-osop-agents
  namespace: ai-osop
  labels:
    app: ai-osop
    component: agents
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-osop
      component: agents
  template:
    metadata:
      labels:
        app: ai-osop
        component: agents
    spec:
      serviceAccountName: ai-osop
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: agent-pool
        # Agents run in-process within the API/orchestrator service (see main.py lifespan),
        # so this deployment uses the same orchestrator image. If agents are ever extracted
        # into a separate process, build and push a dedicated ai-osop/agents image.
        image: ai-osop/orchestrator:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: OSOP_ENV
          value: "production"
        - name: OSOP_AGENT_POOL_SIZE
          value: "10"
        - name: OSOP_ORCHESTRATOR_URL
          value: "http://ai-osop-orchestrator.ai-osop.svc.cluster.local"
        envFrom:
        - secretRef:
            name: ai-osop-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-osop-agents
  namespace: ai-osop
spec:
  selector:
    app: ai-osop
    component: agents
  ports:
  - port: 8200
    targetPort: 8200
  type: ClusterIP
