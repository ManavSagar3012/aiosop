apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-osop-quota
  namespace: ai-osop
  labels:
    app: ai-osop
    component: resource-management
spec:
  hard:
    # Sprint 8: Namespace resource limits
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "50"
    services: "20"
    persistentvolumeclaims: "20"
    secrets: "30"
    configmaps: "20"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-osop-backup
  namespace: ai-osop
  labels:
    app: ai-osop
    component: backup
  annotations:
    # Sprint 8: Backup service account with minimal permissions
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ai-osop-backup-role"
