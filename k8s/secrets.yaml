# k8s/secrets.yaml
#
# WARNING: This file contains placeholder secrets for development ONLY.
# For production, use the External Secrets Operator, Vault, or generate
# this file from your CI/CD pipeline with real values.
#
# See k8s/secrets.yaml.example for the template and instructions.
#
# To generate proper base64-encoded values:
#   echo -n "bolt://neo4j:7687" | base64 -w0
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-osop-secrets
  namespace: ai-osop
  labels:
    app: ai-osop
type: Opaque
stringData:
  neo4j-uri: "bolt://neo4j:7687"
  neo4j-password: "change-me-local"
  postgres-uri: "postgresql+asyncpg://osop:osop@postgres:5432/osop"
  redis-uri: "redis://redis:6379/0"
  api-token: "dev-api-token-2026"
