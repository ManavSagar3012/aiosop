apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-osop-backup
  namespace: ai-osop
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/ai-osop-backup-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-osop
  namespace: ai-osop
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/ai-osop-orchestrator-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-osop-backup-role
  namespace: ai-osop
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-osop-backup-role-binding
  namespace: ai-osop
subjects:
- kind: ServiceAccount
  name: ai-osop-backup
  namespace: ai-osop
roleRef:
  kind: Role
  name: ai-osop-backup-role
  apiGroup: rbac.authorization.k8s.io
