version: '3.8'

services:
  lab-target:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osop-lab-target
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - osop-lab-net

networks:
  osop-lab-net:
    name: osop-lab-network
    driver: bridge
