version: '3.8'

services:
  target-a:
    image: nginx:alpine
    container_name: target-a
    ports:
      - "8001:80"
    volumes:
      - ./target-a-html:/usr/share/nginx/html:ro

  target-b:
    image: python:3.11-slim
    container_name: target-b
    ports:
      - "8002:8000"
    working_dir: /app
    volumes:
      - ./target-b-api:/app
    command: >
      bash -c "pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8000"

  target-c:
    image: nginx:alpine
    container_name: target-c
    ports:
      - "8003:80"
    volumes:
      - ./target-c-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
