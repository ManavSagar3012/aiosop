name: AI-OSOP CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474

      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: osop
          POSTGRES_PASSWORD: osop
          POSTGRES_DB: osop
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-ansi

    - name: Format check (black)
      run: poetry run black --check src tests

    - name: Import sort check (isort)
      run: poetry run isort --check-only src tests

    - name: Lint (flake8)
      run: poetry run flake8 src

    - name: Type check (mypy)
      run: poetry run mypy src

    - name: Run tests
      env:
        OSOP_NEO4J_URI: bolt://localhost:7687
        OSOP_NEO4J_USER: neo4j
        OSOP_NEO4J_PASSWORD: test-password
        OSOP_POSTGRES_URI: postgresql+asyncpg://osop:osop@localhost:5432/osop
        OSOP_REDIS_URI: redis://localhost:6379/0
        OSOP_JWT_SECRET: test-secret-for-ci-only
        OSOP_API_TOKEN: test-token-for-ci-only
      run: poetry run pytest -q --cov=src/ai_osop --cov-fail-under=60

    # Detection-regression tripwire. Re-scores the committed baseline findings
    # export against the ground-truth manifest and fails the build if recall
    # drops below the known-good floor or any negative control is tripped. The
    # scorer's *attribution* and *evidence-parsing* correctness is locked by the
    # unit tests above (tests/test_score_engagement.py); this step is the
    # integration tripwire on the real findings shape so a pipeline change that
    # silently changes the export can't pass unnoticed.
    # MIN-6 (2026-07-21): fail closed when the findings export file is missing.
    # Previously the scorer silently produced a scorecard with 0 findings / 0
    # matched / recall=None, which passed the --min-recall 0.4 gate because
    # None is not < 0.4. The file only exists if an operator ran bench.py first
    # (it is git-ignored), so CI was passing without ever scoring real findings.
    - name: Check bench findings exist before scoring
      id: check-findings
      run: |
        if [ -f "benchmarks/results/juice-e2e-63844f55-findings.json" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "WARNING: bench findings file not found at benchmarks/results/juice-e2e-63844f55-findings.json"
          echo "Run benchmarks/juiceshop/bench.py first to generate it."
        fi

    - name: Detection regression gate (scorecard)
      if: steps.check-findings.outputs.exists == 'true'
      run: >
        poetry run python benchmarks/score_engagement.py
        --findings benchmarks/results/juice-e2e-63844f55-findings.json
        --manifest benchmarks/ground_truth/juice_shop.yaml
        --out scorecard-ci.json
        --min-recall 0.4
        --max-fp 0

    - name: Scorecard skipped (no findings file)
      if: steps.check-findings.outputs.exists != 'true'
      run: |
        echo "::warning title=Bench findings not found::The bench findings export file was not found at benchmarks/results/juice-e2e-63844f55-findings.json. Run benchmarks/juiceshop/bench.py locally and commit the result to enable the detection regression gate."
        echo '{"summary":{"skipped":true,"reason":"findings_file_not_found"}}' > scorecard-ci.json

    - name: Upload scorecard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: detection-scorecard
        path: scorecard-ci.json
        if-no-files-found: warn

    - name: Build Docker image
      run: docker build -t ai-osop:test .

    - name: Check Dockerfile health
      run: |
        docker run -d --name ai-osop-test -p 8200:8200 ai-osop:test
        sleep 10
        curl -f http://localhost:8200/health || exit 1
        docker stop ai-osop-test
        docker rm ai-osop-test

  # MAJ-7 (2026-07-21): real-LLM planning loop integration test.
  # The main test suite mocks the LLM everywhere (OSOP_MOCK_LLM=true); this job
  # exercises the actual think()->LLM->provider path with a locally running
  # ollama model to catch prompt-format regressions and provider drift that the
  # mock suite cannot detect. Runs only on push + workflow_dispatch (not every
  # PR) because pulling the model adds ~2min setup time.
  real-llm-test:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-ansi

    - name: Install ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh

    - name: Pull small model (llama3.2:1b)
      run: |
        ollama pull llama3.2:1b

    - name: Wait for ollama to be ready
      run: |
        for i in $(seq 1 30); do
          curl -s http://localhost:11434/api/tags > /dev/null 2>&1 && break
          sleep 2
        done

    - name: Run real-LLM planning test
      env:
        OSOP_RUN_REAL_LLM: "1"
        OSOP_LLM_PRIMARY: "ollama/llama3.2:1b"
        OSOP_LOG_LEVEL: "WARNING"
      run: poetry run pytest tests/test_real_llm_planning.py -v --no-cov -q 2>&1
