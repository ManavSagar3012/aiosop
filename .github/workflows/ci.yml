# AI-OSOP CI Pipeline
# Phase 4: Developer Experience & Governance
#
# Runs on every PR to main:
# 1. Code formatting & linting
# 2. Secret scanning (trufflehog)
# 3. Unit tests
# 4. Golden path E2E tests
# 5. Type checking

name: CI

on:
  push:
    branches: [main, pr-4-branch]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Formatting & Linting ──────────────────────────────────
  format:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install black isort flake8

      - name: Check formatting (black)
        run: black --check --line-length=100 src/ tests/

      - name: Check import sorting (isort)
        run: isort --check-only --profile=black --line-length=100 src/ tests/

      - name: Lint (flake8)
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503 --exclude=.git,__pycache__,ui,node_modules,.venv src/

  # ── Secret Scanning ───────────────────────────────────────
  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for trufflehog

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ── Unit Tests ────────────────────────────────────────────
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run smoke tests
        run: poetry run pytest tests/test_smoke.py -v --no-cov --tb=short

      - name: Run adversarial audit tests
        run: poetry run pytest tests/test_adversarial_audit.py -v --no-cov --tb=short

  # ── Golden Path E2E ──────────────────────────────────────
  golden-path:
    name: Golden Path E2E
    runs-on: ubuntu-latest
    needs: [format, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run golden path E2E tests
        run: poetry run pytest tests/e2e/test_golden_path.py -v --no-cov --tb=short

  # ── Type Checking ────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mypy
        run: poetry run mypy src --ignore-missing-imports --no-strict-optional || true
        continue-on-error: true  # Advisory, does not block

  # ── Gate: All checks must pass ───────────────────────────
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [format, security, tests, golden-path]
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed — safe to merge"
