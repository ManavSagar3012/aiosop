name: AI-OSOP CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474

      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: osop
          POSTGRES_PASSWORD: osop
          POSTGRES_DB: osop
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-ansi

    - name: Format check (black)
      run: poetry run black --check src tests

    - name: Import sort check (isort)
      run: poetry run isort --check-only src tests

    - name: Lint (flake8)
      run: poetry run flake8 src

    - name: Type check (mypy)
      run: poetry run mypy src

    - name: Run tests with coverage
      env:
        OSOP_NEO4J_URI: bolt://localhost:7687
        OSOP_NEO4J_USER: neo4j
        OSOP_NEO4J_PASSWORD: test-password
        OSOP_POSTGRES_URI: postgresql+asyncpg://osop:osop@localhost:5432/osop
        OSOP_REDIS_URI: redis://localhost:6379/0
        OSOP_JWT_SECRET: test-secret-for-ci-only
        OSOP_API_TOKEN: test-token-for-ci-only
      run: poetry run pytest tests/ --timeout=120 --cov=ai_osop --cov-report=xml --cov-report=term

    - name: Build Docker image
      run: docker build -t ai-osop:test .

    - name: Check database-backed development container startup
      run: |
        trap 'docker logs ai-osop-test; docker rm -f ai-osop-test' EXIT
        docker run -d --name ai-osop-test --network host \
          -e OSOP_ENV=development \
          -e OSOP_NEO4J_URI=bolt://127.0.0.1:7687 \
          -e OSOP_NEO4J_PASSWORD=test-password \
          -e OSOP_POSTGRES_URI=postgresql+asyncpg://osop:osop@127.0.0.1:5432/osop \
          -e OSOP_REDIS_URI=redis://127.0.0.1:6379/0 \
          -e OSOP_JWT_SECRET=test-secret-for-ci-only \
          ai-osop:test
        for attempt in $(seq 1 60); do
          if curl -sf http://127.0.0.1:8200/ready > /tmp/ai-osop-ready.json; then
            python -c "import json; d=json.load(open('/tmp/ai-osop-ready.json')); assert all(d['checks'][x]['status']=='healthy' for x in ('postgres','redis','neo4j'))"
            exit 0
          fi
          sleep 2
        done
        exit 1

  ui-build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: UI Typecheck
        run: npm --prefix ui run typecheck
      - name: UI contract tests
        run: node --test ui/tests/*.test.mjs
      - name: UI Build
        run: npm --prefix ui run build

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate Kubernetes YAML manifests
        run: |
          python3 -c "
          import glob, yaml
          for f in sorted(glob.glob('k8s/*.yaml')):
              print(f'Validating {f}...')
              with open(f) as fp:
                  list(yaml.safe_load_all(fp))
          print('All Kubernetes YAML manifests parsed successfully!')
          "

