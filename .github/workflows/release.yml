name: AI-OSOP Qualification Evidence

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run pytest tests/ --ignore=tests/test_visual_agent.py -v --tb=short

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run black --check src tests
      - run: poetry run isort --check-only src tests
      - run: poetry run mypy src
      - run: poetry run flake8 src

  security:
    name: Security Qualification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run python scripts/qualification/test_security.py

  reliability:
    name: Reliability Qualification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run python scripts/qualification/test_reliability.py

  scale:
    name: Scale Qualification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run python scripts/qualification/test_scale.py

  chaos:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run python scripts/chaos/run_chaos.py

  migration:
    name: Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - run: poetry run alembic check

  release_certificate:
    name: Generate Release Certificate
    runs-on: ubuntu-latest
    needs: [test, lint, security, reliability, scale, chaos, migration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install
      - name: Run local qualification suites
        run: |
          poetry run python scripts/qualification/run_all.py
          poetry run python scripts/qualification/test_self_pentest.py
          poetry run python scripts/chaos/run_chaos.py
      - name: Write explicitly noncertified readiness draft
        run: |
          set +e
          poetry run python scripts/qualification/generate_release_certificate.py
          result=$?
          set -e
          # The generator deliberately returns 2: local evidence cannot mint release authority.
          test "$result" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: noncertified-readiness-draft
          path: RELEASE_READINESS_DRAFT.md

