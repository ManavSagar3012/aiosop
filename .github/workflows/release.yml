name: AI-OSOP Release Certification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest tests/ --ignore=tests/test_visual_agent.py -v --tb=short

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run black --check src tests
      - run: poetry run isort --check-only src tests
      - run: poetry run mypy src
      - run: poetry run flake8 src

  security:
    name: Security Qualification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run python scripts/qualification/test_security.py

  reliability:
    name: Reliability Qualification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run python scripts/qualification/test_reliability.py

  scale:
    name: Scale Qualification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run python scripts/qualification/test_scale.py

  chaos:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run python scripts/chaos/run_chaos.py

  migration:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: osop
          POSTGRES_PASSWORD: osop
          POSTGRES_DB: osop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run alembic check
        env:
          OSOP_POSTGRES_URI: postgresql+asyncpg://osop:osop@localhost:5432/osop

  release_certificate:
    name: Generate Release Certificate
    runs-on: ubuntu-latest
    needs: [test, lint, security, reliability, scale, chaos, migration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install
      - run: |
          echo "# AI-OSOP Release Certificate" > RELEASE_CERTIFICATE.md
          echo "" >> RELEASE_CERTIFICATE.md
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> RELEASE_CERTIFICATE.md
          echo "**Git SHA:** ${{ github.sha }}" >> RELEASE_CERTIFICATE.md
          echo "" >> RELEASE_CERTIFICATE.md
          echo "## CI Results" >> RELEASE_CERTIFICATE.md
          echo "- Test Suite: PASS" >> RELEASE_CERTIFICATE.md
          echo "- Lint: PASS" >> RELEASE_CERTIFICATE.md
          echo "- Security Qualification: PASS" >> RELEASE_CERTIFICATE.md
          echo "- Reliability Qualification: PASS" >> RELEASE_CERTIFICATE.md
          echo "- Scale Qualification: PASS" >> RELEASE_CERTIFICATE.md
          echo "- Chaos Tests: PASS" >> RELEASE_CERTIFICATE.md
          echo "- Migration Check: PASS" >> RELEASE_CERTIFICATE.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-certificate
          path: RELEASE_CERTIFICATE.md
