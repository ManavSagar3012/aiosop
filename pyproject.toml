[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-osop"
version = "0.1.0"
description = "AI Offensive Security Orchestration Platform"
authors = ["AI-OSOP Team <team@ai-osop.dev>"]
readme = "README.md"
license = "MIT"
packages = [{include = "ai_osop", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
neo4j = "^5.18.0"
redis = "^5.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
aiohttp = "^3.9.0"
websockets = "^12.0"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
prometheus-client = "^0.20.0"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
opentelemetry-instrumentation-fastapi = "^0.44b0"
structlog = "^24.1.0"
python-dotenv = "^1.0.0"
docker = "^7.0.0"

# AI/ML
litellm = "^1.0.0"
langgraph = "^0.0.30"
langchain = "^0.1.0"
langchain-openai = "^0.0.8"
jinja2 = "^3.1.6"
markdown = "^3.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[tool.poetry.scripts]
ai-osop = "ai_osop.cli:main"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/ai_osop --cov-report=term-missing"
