[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-osop"
version = "0.1.0"
description = "AI Offensive Security Orchestration Platform"
authors = ["AI-OSOP Team <team@ai-osop.dev>"]
readme = "README.md"
license = "MIT"
packages = [{include = "ai_osop", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.31.1"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
neo4j = "^5.18.0"
redis = "^5.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
aiohttp = "^3.9.0"
websockets = "^12.0"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
prometheus-client = "^0.20.0"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
opentelemetry-instrumentation-fastapi = "^0.44b0"
opentelemetry-exporter-otlp = "^1.23.0"
opentelemetry-instrumentation-httpx = "^0.44b0"
opentelemetry-instrumentation-redis = "^0.44b0"
opentelemetry-instrumentation-sqlalchemy = "^0.44b0"
structlog = "^24.1.0"
python-dotenv = "^1.0.0"
sentry-sdk = "^2.0.0"
docker = "^7.0.0"

# AI/ML
litellm = "^1.0.0"
langgraph = "^0.0.30"
langchain = "^0.1.0"
langchain-openai = "^0.0.8"
jinja2 = "^3.1.6"
markdown = "^3.10.2"
psutil = "^7.2.2"
cachetools = "^7.1.4"
cryptography = "48.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-timeout = "^2.3.1"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
aiosqlite = "^0.22.1"
boto3 = "^1.43.62"

[tool.poetry.scripts]
ai-osop = "ai_osop.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E722 bans bare `except:`; the rest catch common silent-failure / dead-code smells.
# Enforced in CI; a pytest AST guard (tests/test_lint_guards.py) enforces E722 locally too.
# BLE001 catches `except Exception` (too broad) — part of the P1-15 fix campaign.
# (ruff's flake8-blind-except equivalent of pylint's W0718.)
# T201 catches `print()` statements in production code — part of the P1-16 fix campaign.
select = ["E722", "F811", "F841", "BLE001", "T201"]

[tool.ruff.lint.per-file-ignores]
# Allow print() in test files, scripts, and CLI entry points
"tests/*" = ["T201", "BLE001"]
"scripts/*" = ["T201", "BLE001"]
"src/ai_osop/cli.py" = ["T201"]
"src/ai_osop/memory/graph_integrity_checker.py" = ["T201"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# AIOSOP-AUDIT-2026-06-16: src-layout package was not importable under pytest
# (not installed, no conftest) so the whole suite errored on collection. Putting
# src on sys.path lets `pytest` run out-of-the-box without `pip install -e .`.
pythonpath = ["src"]
# Coverage is NOT collected by default: it makes every run ~35x slower and the
# old `--cov-fail-under=70` here spuriously failed single-file/TDD runs at ~17%
# total coverage even when the selected tests passed. The real gate lives in CI
# (.github/workflows/ci.yml runs `pytest --cov=src/ai_osop --cov-fail-under=60`).
# For a local coverage report: `pytest --cov=src/ai_osop --cov-report=term-missing`.
addopts = "--timeout=120 --timeout-method=thread"
markers = [
    "integration: requires live Postgres / external services; skips when unavailable",
]

