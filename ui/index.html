    <style>
        body {
            background-color: #050505;
            color: #e5e2e1;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .scanline {
            width: 100%;
            height: 100%;
            z-index: 50;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 4px;
            position: absolute;
            pointer-events: none;
            animation: scanline 10s linear infinite;
        }
        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }
        .glow-cyan { box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        .glow-red { box-shadow: 0 0 10px rgba(255, 0, 60, 0.3); }
        .glow-green { box-shadow: 0 0 10px rgba(0, 255, 102, 0.3); }
        .flicker { animation: flicker 0.15s infinite alternate; }
        @keyframes flicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .caution-border {
            background: repeating-linear-gradient(45deg, #00ffcc, #00ffcc 10px, #000 10px, #000 20px);
        }
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-track { background: #050505; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .node-inspect {
            transition: all 0.2s ease-out;
            opacity: 0;
            pointer-events: none;
        }
        .node-trigger:hover + .node-inspect, .node-inspect:hover {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
  </head>
  <body class="font-body-md text-body-md">
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
