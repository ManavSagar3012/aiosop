# Alembic configuration for AI-OSOP
# Run migrations with: alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# NOTE: overridden at runtime by migrations/env.py from OSOP_POSTGRES_URI when set
# (AIOSOP-ALEMBIC-URL-001). This is only the fallback; keep it pointed at where the
# dockerised Postgres actually listens on the host (remapped 15432 -> container 5432).
sqlalchemy.url = postgresql+asyncpg://ai_osop:ai_osop@127.0.0.1:15432/ai_osop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
