# AI-OSOP Pre-Commit Hooks
# Phase 4: Developer Experience & Governance
#
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  # Security: Secret scanning with TruffleHog
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.82.13
    hooks:
      - id: trufflehog
        entry: trufflehog filesystem --only-verified --fail --json .
        args:
          - "--exclude-paths=.pre-commit-config.yaml"
          - "--exclude-paths=ui/"
          - "--exclude-paths=*.md"
          - "--exclude-paths=*.json"
          - "--exclude-paths=*.yml"
          - "--exclude-paths=*.yaml"

  # Formatting: Black code formatter
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=100"]

  # Import sorting: isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # Linting: flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=100"
          - "--extend-ignore=E203,W503"
          - "--exclude=.git,__pycache__,ui,node_modules,.venv"
        additional_dependencies: []

  # Type checking: mypy (non-blocking, advisory)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        additional_dependencies: []
        pass_returncode: true  # Advisory only, does not block

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-private-key
