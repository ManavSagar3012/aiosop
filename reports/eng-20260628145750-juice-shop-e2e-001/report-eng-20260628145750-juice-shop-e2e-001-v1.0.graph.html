<!DOCTYPE html>
<html>
<head>
    <title>Attack Graph - eng-20260628145750-juice-shop-e2e-001</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: monospace; background: #05070a; color: #e0e0e0; }
        .node circle { stroke: #fff; stroke-width: 1.5px; }
        .node text { font: 10px sans-serif; pointer-events: none; text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff; fill: #000; }
        .link { stroke: #999; stroke-opacity: .6; }
    </style>
</head>
<body>
    <h2>Engagement: eng-20260628145750-juice-shop-e2e-001</h2>
    <div id="graph"></div>
    <script>
        const graphData = {"nodes": [{"id": "task-b976b53892da", "labels": ["Task"]}, {"id": "asset-127.0.0.1:3000", "labels": ["Asset"]}, {"id": "ep-278df66e6e32", "labels": ["Endpoint"]}, {"id": "ep-610528257d4a", "labels": ["Endpoint"]}, {"id": "ep-100f23967d8b", "labels": ["Endpoint"]}, {"id": "ep-33ed38b70d1a", "labels": ["Endpoint"]}, {"id": "task-43b43ecdf424", "labels": ["Task"]}, {"id": "ep-e8ab6d72af83", "labels": ["Endpoint"]}, {"id": "task-4575f913c025", "labels": ["Task"]}, {"id": "task-094f2ea51f87", "labels": ["Task"]}, {"id": "endpoint-127.0.0.1:3000", "labels": ["Endpoint"]}, {"id": "task-6f2cfe35b346", "labels": ["Task"]}, {"id": "task-0683404fb289", "labels": ["Task"]}, {"id": "vuln-a8a5eb728d77", "labels": ["Vulnerability"]}, {"id": "vuln-045d08935128", "labels": ["Vulnerability"]}, {"id": "vuln-ffc748ed68fb", "labels": ["Vulnerability"]}, {"id": "task-4f1d303087dd", "labels": ["Task"]}, {"id": "vuln-77e743e43448", "labels": ["Vulnerability"]}, {"id": "vuln-32d74ce6fa66", "labels": ["Vulnerability"]}, {"id": "vuln-e1af41fd3537", "labels": ["Vulnerability"]}, {"id": "vuln-19adaa3f556f", "labels": ["Vulnerability"]}, {"id": "vuln-5df2808959c2", "labels": ["Vulnerability"]}, {"id": "vuln-a3717e2219ed", "labels": ["Vulnerability"]}, {"id": "task-109092d0a870", "labels": ["Task"]}, {"id": "task-296bcbe4dbee", "labels": ["Task"]}], "edges": [{"source": "asset-127.0.0.1:3000", "target": "endpoint-127.0.0.1:3000", "type": "HAS_ENDPOINT"}]};
        
        const width = 800;
        const height = 600;
        const svg = d3.select("#graph").append("svg").attr("width", width).attr("height", height);
        
        const simulation = d3.forceSimulation(graphData.nodes)
            .force("link", d3.forceLink(graphData.edges).id(d => d.id))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(graphData.edges)
            .enter().append("line")
            .attr("class", "link");

        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(graphData.nodes)
            .enter().append("g");

        node.append("circle")
            .attr("r", 5)
            .attr("fill", d => d.labels.includes("Vulnerability") ? "red" : "cyan");

        node.append("text")
            .text(d => d.id)
            .attr('x', 6)
            .attr('y', 3);

        simulation.nodes(graphData.nodes).on("tick", ticked);
        simulation.force("link").links(graphData.edges);

        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }
    </script>
</body>
</html>
