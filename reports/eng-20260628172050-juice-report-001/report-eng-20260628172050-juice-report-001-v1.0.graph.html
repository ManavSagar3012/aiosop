<!DOCTYPE html>
<html>
<head>
    <title>Attack Graph - eng-20260628172050-juice-report-001</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: monospace; background: #05070a; color: #e0e0e0; }
        .node circle { stroke: #fff; stroke-width: 1.5px; }
        .node text { font: 10px sans-serif; pointer-events: none; text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff; fill: #000; }
        .link { stroke: #999; stroke-opacity: .6; }
    </style>
</head>
<body>
    <h2>Engagement: eng-20260628172050-juice-report-001</h2>
    <div id="graph"></div>
    <script>
        const graphData = {"nodes": [{"id": "task-004b2c8aad4e", "labels": ["Task"]}, {"id": "ep-128b76aedee9", "labels": ["Endpoint"]}, {"id": "task-149b239c72dd", "labels": ["Task"]}, {"id": "task-c5f36c3cebca", "labels": ["Task"]}, {"id": "vuln-7a2c62b52f25", "labels": ["Vulnerability"]}, {"id": "vuln-668ac545dd4e", "labels": ["Vulnerability"]}, {"id": "vuln-0374fa2e6214", "labels": ["Vulnerability"]}, {"id": "task-ff17f324b064", "labels": ["Task"]}, {"id": "ep-216569f69c8f", "labels": ["Endpoint"]}, {"id": "ep-87c3c549b1f2", "labels": ["Endpoint"]}, {"id": "task-b41d60069013", "labels": ["Task"]}, {"id": "task-f2c1bee731f9", "labels": ["Task"]}, {"id": "task-76465e1744f3", "labels": ["Task"]}, {"id": "task-c300242e05b3", "labels": ["Task"]}, {"id": "task-3546180dfa2a", "labels": ["Task"]}, {"id": "task-a18354e68e5c", "labels": ["Task"]}, {"id": "task-b48ced717e54", "labels": ["Task"]}], "edges": []};
        
        const width = 800;
        const height = 600;
        const svg = d3.select("#graph").append("svg").attr("width", width).attr("height", height);
        
        const simulation = d3.forceSimulation(graphData.nodes)
            .force("link", d3.forceLink(graphData.edges).id(d => d.id))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(graphData.edges)
            .enter().append("line")
            .attr("class", "link");

        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(graphData.nodes)
            .enter().append("g");

        node.append("circle")
            .attr("r", 5)
            .attr("fill", d => d.labels.includes("Vulnerability") ? "red" : "cyan");

        node.append("text")
            .text(d => d.id)
            .attr('x', 6)
            .attr('y', 3);

        simulation.nodes(graphData.nodes).on("tick", ticked);
        simulation.force("link").links(graphData.edges);

        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }
    </script>
</body>
</html>
